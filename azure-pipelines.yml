# =====================================================================
# Pipeline Azure DevOps — FamilyBalance (Angular 17 / Node.js / MongoDB)
#   1. Build        2. Tests         3. SonarCloud    4. Infra MicroK8s
#   5. Docker       6. Sécurité      7. Deploy Dev    8. Deploy Prod
#   9. Monitoring
#
# Agent self-hosted : ibrahim-virtual-machine (pool Default)
# =====================================================================

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  name: Default
  demands:
    - agent.name -equals ibrahim-virtual-machine

variables:
  imageTag: '$(Build.BuildId)'
  containerRegistry: 'localhost:32000'
  backendRepository: 'familybalance-backend'
  frontendRepository: 'familybalance-frontend'
  dockerHubNamespace: 'ibrahimfr'
  dockerHubServiceConnection: 'dockerhub'
  nodeVersion: '20.x'

  devNamespace: 'familybalance-dev'
  prodNamespace: 'familybalance'

  sonarServiceConnection: 'SonarQube Cloud'
  sonarOrganization: 'ibrahimfartoun'
  sonarProjectKey: 'familybalance'

  microk8s: '/snap/bin/microk8s'
  kubectl: '/snap/bin/microk8s kubectl'

  isMain: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]

stages:

# =====================================================
# 1. BUILD
# =====================================================
- stage: Build
  displayName: "🏗 Build"

  jobs:
  - job: Backend
    displayName: "🟢 Backend Node.js"
    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: "⚙ Node.js $(nodeVersion)"
      inputs:
        versionSpec: $(nodeVersion)

    - script: npm ci
      workingDirectory: backend
      displayName: "📥 npm ci"

    - script: |
        set -e
        find src -name '*.js' -print0 | xargs -0 -n1 node --check
        node -e "require('./src/app')"
      workingDirectory: backend
      displayName: "🔨 Vérification syntaxique + chargement de l'app"
      env:
        NODE_ENV: test

  - job: Frontend
    displayName: "🅰 Frontend Angular"
    dependsOn: Backend
    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: "⚙ Node.js $(nodeVersion)"
      inputs:
        versionSpec: $(nodeVersion)

    - script: npm ci
      workingDirectory: frontend
      displayName: "📥 npm ci"

    - script: npm run build -- --configuration production
      workingDirectory: frontend
      displayName: "🔨 Build Angular production"

    - task: PublishBuildArtifacts@1
      displayName: "📦 Publish Angular dist"
      inputs:
        PathtoPublish: 'frontend/dist'
        ArtifactName: 'frontend-dist'
        publishLocation: 'Container'

# =====================================================
# 2. TESTS
# =====================================================
- stage: Tests
  displayName: "🧪 Tests"
  dependsOn: Build

  jobs:
  - job: UnitTests
    steps:
    - checkout: self

    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)

    - script: npm ci
      workingDirectory: backend
      displayName: "📥 npm ci"

    - script: npm test -- --ci --coverage --coverageReporters=lcov --coverageReporters=text-summary
      workingDirectory: backend
      displayName: "🧪 Tests API (Jest + couverture)"

    - script: npm audit --omit=dev --audit-level=critical
      workingDirectory: backend
      displayName: "🛡 npm audit (critiques)"
      continueOnError: true

    - publish: backend/coverage
      artifact: backend-coverage
      displayName: "📦 Publish couverture"

# =====================================================
# 3. SONARCLOUD
# =====================================================
- stage: SonarCloud
  displayName: "🔍 SonarCloud Analysis"
  dependsOn: Tests

  jobs:
  - job: Sonar
    steps:
    - checkout: self
      fetchDepth: 0

    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)

    - download: current
      artifact: backend-coverage
      displayName: "📥 Récupération couverture"

    - script: |
        set -e
        mkdir -p backend/coverage
        cp -r $(Pipeline.Workspace)/backend-coverage/* backend/coverage/
        ls -la backend/coverage
      displayName: "📂 Copie de la couverture"

    - task: SonarCloudPrepare@3
      displayName: "⚙ Préparation SonarCloud"
      inputs:
        SonarCloud: $(sonarServiceConnection)
        organization: $(sonarOrganization)
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: $(sonarProjectKey)
        cliProjectName: 'FamilyBalance'
        cliSources: '.'
        extraProperties: |
          sonar.sources=backend/src,frontend/src
          sonar.tests=backend/tests
          sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/environments/**
          sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
          sonar.scm.revision=$(Build.SourceVersion)

    - task: SonarCloudAnalyze@3
      displayName: "🔍 SonarCloud Scan"

    # Quality Gate : non publié sur les PR (offre gratuite + projet privé =
    # pas d'accès aux branches secondaires). La branche principale doit
    # s'appeler « main » dans SonarCloud (Administration > Branches).
    # continueOnError : à retirer une fois le Quality Gate fonctionnel.
    - task: SonarCloudPublish@3
      displayName: "📊 Publication Quality Gate"
      condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
      continueOnError: true
      inputs:
        pollingTimeoutSec: '300'

# =====================================================
# 4. INFRA MICROK8S
# =====================================================
- stage: Infra
  displayName: "🌍 Infra MicroK8s"
  dependsOn: SonarCloud
  condition: and(succeeded(), eq(variables.isMain, true))

  jobs:
  - job: ClusterSetup
    steps:
    - checkout: none

    - script: |
        set -e
        $(microk8s) status --wait-ready --timeout 120
        $(kubectl) get nodes -o wide
      displayName: "🔐 Validation du cluster"

    - script: |
        set -e
        for addon in dns ingress registry metrics-server; do
          if $(microk8s) status --addon $addon | grep -q enabled; then
            echo "✔ $addon déjà activé"
          else
            echo "➕ Activation de $addon"
            $(microk8s) enable $addon
          fi
        done
      displayName: "⚙ Addons MicroK8s (dns, ingress, registry, metrics-server)"
      continueOnError: true

    - script: |
        set -e
        for ns in $(devNamespace) $(prodNamespace); do
          $(kubectl) create namespace $ns --dry-run=client -o yaml | $(kubectl) apply -f -
        done
        $(kubectl) get ns
      displayName: "📁 Namespaces dev + prod"

# =====================================================
# 5. DOCKER BUILD + PUSH
# =====================================================
- stage: Docker
  displayName: "🐳 Docker Build & Push"
  dependsOn: Infra

  jobs:
  - job: DockerBuildPush
    steps:
    - checkout: self

    - script: |
        curl -sf http://$(containerRegistry)/v2/ > /dev/null || {
          echo "##[error]Registre $(containerRegistry) injoignable (microk8s enable registry)"
          exit 1
        }
        echo "✅ Registre disponible"
      displayName: "🔐 Vérification registre MicroK8s"

    - script: |
        set -e
        for app in backend frontend; do
          repo=familybalance-$app
          docker build \
            -f $app/Dockerfile \
            -t $(containerRegistry)/$repo:$(imageTag) \
            -t $(containerRegistry)/$repo:latest \
            $app
          docker push $(containerRegistry)/$repo:$(imageTag)
          docker push $(containerRegistry)/$repo:latest
        done
        echo "✅ Docker Push Success"
      displayName: "🐳 Build & Push (registre local)"

    - task: Docker@2
      displayName: "🔐 Login Docker Hub"
      continueOnError: true
      inputs:
        command: login
        containerRegistry: $(dockerHubServiceConnection)

    - script: |
        set -e
        for repo in $(backendRepository) $(frontendRepository); do
          for tag in $(imageTag) latest; do
            docker tag $(containerRegistry)/$repo:$tag $(dockerHubNamespace)/$repo:$tag
            docker push $(dockerHubNamespace)/$repo:$tag
          done
        done
      displayName: "📤 Publication Docker Hub"
      continueOnError: true

    - task: Docker@2
      displayName: "🔓 Logout Docker Hub"
      condition: always()
      continueOnError: true
      inputs:
        command: logout
        containerRegistry: $(dockerHubServiceConnection)

    - publish: k8s
      artifact: manifests
      displayName: "📦 Publish manifestes Kubernetes"

# =====================================================
# 6. SECURITY SCAN (Trivy)
#   - cache persistant ~/.cache/trivy (survit aux redémarrages)
#   - 3 tentatives + miroir de secours pour la base
#   - repli sur la base en cache si le réseau coupe
# =====================================================
- stage: Security
  displayName: "🔒 Security Scan"
  dependsOn: Docker

  jobs:
  - job: TrivyScan
    timeoutInMinutes: 60
    steps:
    - checkout: none

    - script: |
        set -e
        export PATH="$HOME/.local/bin:$PATH"
        if ! command -v trivy &> /dev/null; then
          mkdir -p $HOME/.local/bin
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b $HOME/.local/bin
        fi
        trivy --version
      displayName: "⚙ Install Trivy"

    - script: |
        export PATH="$HOME/.local/bin:$PATH"
        CACHE="$HOME/.cache/trivy"
        mkdir -p "$CACHE"
        for i in 1 2 3; do
          echo "📥 Mise à jour DB Trivy (tentative $i/3)"
          if trivy image --download-db-only --no-progress \
               --cache-dir "$CACHE" \
               --db-repository mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2; then
            echo "✅ DB à jour"
            exit 0
          fi
          sleep 20
        done
        if [ -f "$CACHE/db/trivy.db" ]; then
          echo "##[warning]Mise à jour impossible — utilisation de la DB en cache"
          exit 0
        fi
        echo "##[error]Aucune base Trivy disponible"
        exit 1
      displayName: "📥 Base de vulnérabilités Trivy"

    - script: |
        set -e
        export PATH="$HOME/.local/bin:$PATH"
        for repo in $(backendRepository) $(frontendRepository); do
          echo "=== 🔍 $repo:$(imageTag) ==="
          trivy image \
            --cache-dir "$HOME/.cache/trivy" \
            --skip-db-update \
            --no-progress \
            --timeout 30m \
            --exit-code 0 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --format table \
            $(containerRegistry)/$repo:$(imageTag)
        done
        echo "✅ Trivy Scan terminé"
      displayName: "🔍 Trivy Security Scan"

# =====================================================
# 7. DEPLOY DEV
# =====================================================
- stage: Deploy_Dev
  displayName: "🚀 Deploy Dev"
  dependsOn: Security

  jobs:
  - deployment: DevDeploy
    environment: familybalance-dev
    strategy:
      runOnce:
        deploy:
          steps:

          - script: |
              set -e
              rm -rf $(Agent.TempDirectory)/k8s-dev
              cp -r $(Pipeline.Workspace)/manifests $(Agent.TempDirectory)/k8s-dev
              cd $(Agent.TempDirectory)/k8s-dev
              sed -i -E '/^[[:space:]]+namespace:[[:space:]]/d' *.yaml
              sed -i -E "s#(image:[[:space:]]*)[^[:space:]]*$(backendRepository)(:[^[:space:]]*)?#\1$(containerRegistry)/$(backendRepository):$(imageTag)#" backend.yaml
              sed -i -E "s#(image:[[:space:]]*)[^[:space:]]*$(frontendRepository)(:[^[:space:]]*)?#\1$(containerRegistry)/$(frontendRepository):$(imageTag)#" frontend.yaml
              grep -H "image:" backend.yaml frontend.yaml
            displayName: "🔧 Préparation manifestes (tag $(imageTag))"

          - script: |
              $(kubectl) create secret generic appinsights-secret \
                --from-literal=APPLICATIONINSIGHTS_CONNECTION_STRING="$(APPLICATIONINSIGHTS_CONNECTION_STRING)" \
                -n $(devNamespace) \
                --dry-run=client -o yaml | $(kubectl) apply -f -
            displayName: "🔐 Create AppInsights Secret"

          # Les secrets applicatifs (MongoDB, JWT…) n'existent qu'en prod :
          # on les recopie dans le namespace dev avant le déploiement.
          - script: |
              set -e
              for s in mongodb-secret familybalance-secrets familybalance-mongodb-auth; do
                $(kubectl) get secret $s -n $(prodNamespace) -o yaml \
                  | sed -E '/^\s*(namespace|resourceVersion|uid|creationTimestamp):/d' \
                  | $(kubectl) apply -n $(devNamespace) -f -
              done
            displayName: "🔐 Copie des secrets prod → dev"

          - script: |
              set -e
              $(kubectl) apply -n $(devNamespace) -f $(Agent.TempDirectory)/k8s-dev/mongodb.yaml
              $(kubectl) rollout status statefulset/mongodb -n $(devNamespace) --timeout=180s || \
              $(kubectl) wait --for=condition=ready pod -l app=mongodb -n $(devNamespace) --timeout=180s
            displayName: "🗄 Deploy MongoDB"

          - script: |
              set -e
              cd $(Agent.TempDirectory)/k8s-dev
              $(kubectl) apply -n $(devNamespace) -f backend.yaml
              $(kubectl) apply -n $(devNamespace) -f frontend.yaml
              # 1 seul frontend en dev pour économiser les ressources de la VM
              $(kubectl) scale deployment/$(frontendRepository) --replicas=1 -n $(devNamespace)
            displayName: "🚀 Deploy Backend + Frontend"

          - script: |
              echo "⏳ Attente du rollout..."
              failed=0
              for d in $($(kubectl) get deployments -n $(devNamespace) -o name); do
                $(kubectl) rollout status "$d" -n $(devNamespace) --timeout=180s || { failed=1; bad="$d"; break; }
              done

              if [ $failed -eq 1 ]; then
                echo ""
                echo "❌ Rollout échoué ($bad) — Diagnostic en cours..."
                echo "=== 📋 État des pods ==="
                $(kubectl) get pods -n $(devNamespace) -o wide
                echo "=== ⚠️ Erreurs des pods ==="
                $(kubectl) describe pods -n $(devNamespace) | grep -E "Warning|Error:" | tail -20
                echo "=== 🔍 Événements récents ==="
                $(kubectl) get events -n $(devNamespace) --sort-by=.lastTimestamp | tail -30
                echo "=== 📜 Logs ==="
                $(kubectl) logs -n $(devNamespace) "$bad" --tail=100 --previous 2>/dev/null || \
                $(kubectl) logs -n $(devNamespace) "$bad" --tail=100 2>/dev/null || \
                echo "⚠️ Aucun log"
                echo "=== 🔄 Rollback ==="
                $(kubectl) rollout undo "$bad" -n $(devNamespace) || true
                exit 1
              fi

              echo "✅ Déploiement Dev réussi"
              $(kubectl) get pods,svc -n $(devNamespace)
            displayName: "✅ Validate Rollout + Diagnostics"

# =====================================================
# 8. DEPLOY PROD
# =====================================================
- stage: Deploy_Prod
  displayName: "🚀 Deploy Prod"
  dependsOn: Deploy_Dev

  jobs:
  - deployment: ProdDeploy
    environment: familybalance-prod
    strategy:
      runOnce:
        deploy:
          steps:

          - script: |
              set -e
              rm -rf $(Agent.TempDirectory)/k8s-prod
              cp -r $(Pipeline.Workspace)/manifests $(Agent.TempDirectory)/k8s-prod
              cd $(Agent.TempDirectory)/k8s-prod
              sed -i -E "s#(image:[[:space:]]*)[^[:space:]]*$(backendRepository)(:[^[:space:]]*)?#\1$(containerRegistry)/$(backendRepository):$(imageTag)#" backend.yaml
              sed -i -E "s#(image:[[:space:]]*)[^[:space:]]*$(frontendRepository)(:[^[:space:]]*)?#\1$(containerRegistry)/$(frontendRepository):$(imageTag)#" frontend.yaml
              grep -H "image:" backend.yaml frontend.yaml
            displayName: "🔧 Préparation manifestes (tag $(imageTag))"

          - script: $(kubectl) apply -f $(Agent.TempDirectory)/k8s-prod/namespace.yaml
            displayName: "📁 Namespace"

          - script: |
              $(kubectl) create secret generic appinsights-secret \
                --from-literal=APPLICATIONINSIGHTS_CONNECTION_STRING="$(APPLICATIONINSIGHTS_CONNECTION_STRING)" \
                -n $(prodNamespace) \
                --dry-run=client -o yaml | $(kubectl) apply -f -
            displayName: "🔐 Create AppInsights Secret"

          - script: |
              set -e
              cd $(Agent.TempDirectory)/k8s-prod
              $(kubectl) apply -n $(prodNamespace) -f mongodb.yaml
              $(kubectl) apply -n $(prodNamespace) -f backend.yaml
              $(kubectl) apply -n $(prodNamespace) -f frontend.yaml
              $(kubectl) apply -n $(prodNamespace) -f ingress.yaml
            displayName: "🚀 Deploy MongoDB, Backend, Frontend, Ingress"

          - script: |
              failed=0
              for d in $($(kubectl) get deployments -n $(prodNamespace) -o name); do
                echo "⏳ $d"
                $(kubectl) rollout status "$d" -n $(prodNamespace) --timeout=180s || { failed=1; bad="$d"; break; }
              done

              if [ $failed -eq 1 ]; then
                echo "❌ Rollout échoué ($bad)"
                $(kubectl) get pods -n $(prodNamespace) -o wide
                echo "=== ⚠️ Erreurs des pods ==="
                $(kubectl) describe pods -n $(prodNamespace) | grep -E "Warning|Error:" | tail -20
                $(kubectl) logs -n $(prodNamespace) "$bad" --tail=100 2>/dev/null || true
                echo "=== 🔄 Rollback ==="
                $(kubectl) rollout undo "$bad" -n $(prodNamespace) || true
                exit 1
              fi

              echo "✅ Déploiement Prod réussi"
              $(kubectl) get pods,svc,ingress -n $(prodNamespace)
            displayName: "✅ Validate Rollout"

# =====================================================
# 9. MONITORING
# =====================================================
- stage: Monitoring
  displayName: "📊 Monitoring"
  dependsOn: Deploy_Prod

  jobs:
  - job: MonitoringCheck
    steps:
    - checkout: none

    - script: |
        $(kubectl) get pods -A
        echo ""
        $(kubectl) top nodes || true
        echo ""
        $(kubectl) top pods -n $(prodNamespace) || true
      displayName: "📈 Kubernetes Monitoring"

    - script: |
        $(kubectl) get pods -n $(prodNamespace) \
          -o jsonpath='{range .items[*]}{.metadata.name}{"  restarts="}{.status.containerStatuses[0].restartCount}{"\n"}{end}'
      displayName: "🔁 Redémarrages des pods"

    - script: |
        if [ -n "$(APPLICATIONINSIGHTS_CONNECTION_STRING)" ]; then
          echo "✅ Application Insights configuré (secret appinsights-secret présent)"
          $(kubectl) get secret appinsights-secret -n $(prodNamespace)
        else
          echo "##[warning]APPLICATIONINSIGHTS_CONNECTION_STRING non défini"
        fi
      displayName: "📊 Verify App Insights"