# Pipeline Azure DevOps de FamilyBalance
#   1. CI     : installation, vérification du backend, build Angular de production
#   2. Images : construction et envoi des images backend / frontend vers Azure Container Registry
#   3. Deploy : déploiement des manifestes k8s/ sur le cluster MicroK8s local,
#               via l'agent self-hosted « ibrahim-virtual-machine » (pool Default)
#
# Pourquoi un agent self-hosted ?
#   Le cluster MicroK8s est sur une IP privée (192.168.x.x) : Azure DevOps (cloud) refuse
#   une service connection Kubernetes vers ce type d'adresse. L'agent installé sur la VM
#   exécute donc kubectl localement, sans service connection Kubernetes.
#
# À configurer une fois dans Azure DevOps :
#   - Service connection « Docker Registry » vers l'ACR  -> variable dockerRegistryServiceConnection
#   - Variables secrètes du pipeline (Pipelines > Edit > Variables) :
#       ACR_USERNAME  : utilisateur admin de l'ACR (Portail Azure > ACR > Access keys)
#       ACR_PASSWORD  : mot de passe admin de l'ACR (cocher « Keep this value secret »)
#   - Environnement « familybalance-production » (Pipelines > Environments)
#
# Prérequis sur la VM :
#   - agent démarré en tant qu'ibrahim, membre du groupe microk8s
#   - microk8s enable dns ingress

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  dockerRegistryServiceConnection: 'familybalance-acr'
  containerRegistry: 'familybalanceacr.azurecr.io'
  backendRepository: 'familybalance-backend'
  frontendRepository: 'familybalance-frontend'
  k8sNamespace: 'familybalance'
  imagePullSecret: 'acr-secret'
  imageTag: '$(Build.BuildId)'
  nodeVersion: '20.x'
  # Tous les jobs tournent sur l'agent self-hosted (pas de parallélisme Microsoft-hosted gratuit).
  # Pour revenir aux agents Microsoft : remettre « vmImage: 'ubuntu-latest' » dans les jobs CI et Images.
  selfHostedPool: 'Default'
  # Chemin complet : le service de l'agent n'a pas forcément /snap/bin dans son PATH
  kubectl: '/snap/bin/microk8s kubectl'

stages:
  # ------------------------------------------------------------------ CI
  - stage: CI
    displayName: 'Vérification et build'
    jobs:
      - job: Backend
        displayName: 'Backend (Node.js)'
        pool:
          name: Default
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Node.js $(nodeVersion)'

          - script: npm ci
            workingDirectory: backend
            displayName: 'npm ci'

          - script: |
              set -e
              find src -name '*.js' -print0 | xargs -0 -n1 node --check
              node -e "require('./src/app')"
            workingDirectory: backend
            displayName: 'Vérification syntaxique et chargement de l''application'
            env:
              NODE_ENV: test

          - script: npm test -- --ci
            workingDirectory: backend
            displayName: 'Tests de l''API (Jest)'

          - script: npm audit --omit=dev --audit-level=critical
            workingDirectory: backend
            displayName: 'Audit des dépendances (vulnérabilités critiques)'
            continueOnError: true

      - job: Frontend
        displayName: 'Frontend (Angular)'
        pool:
          name: $(selfHostedPool)
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Node.js $(nodeVersion)'

          - script: npm ci
            workingDirectory: frontend
            displayName: 'npm ci'

          - script: npm run build -- --configuration production
            workingDirectory: frontend
            displayName: 'Build Angular de production'

  # ------------------------------------------------------------------ Images
  - stage: Images
    displayName: 'Images Docker'
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildPush
        displayName: 'Construction et envoi vers ACR'
        pool:
          name: $(selfHostedPool)
        steps:
          - task: Docker@2
            displayName: 'Image backend'
            inputs:
              command: buildAndPush
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: $(backendRepository)
              Dockerfile: backend/Dockerfile
              buildContext: backend
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: 'Image frontend'
            inputs:
              command: buildAndPush
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: $(frontendRepository)
              Dockerfile: frontend/Dockerfile
              buildContext: frontend
              tags: |
                $(imageTag)
                latest

          - publish: k8s
            artifact: manifests
            displayName: 'Publication des manifestes Kubernetes'

  # ------------------------------------------------------------------ Deploy
  - stage: Deploy
    displayName: 'Déploiement MicroK8s'
    dependsOn: Images
    condition: succeeded()
    jobs:
      - deployment: DeployMicroK8s
        displayName: 'Déploiement sur MicroK8s (agent self-hosted)'
        pool:
          name: $(selfHostedPool)
        environment: 'familybalance-production'
        strategy:
          runOnce:
            deploy:
              steps:
                # L'artefact « manifests » est téléchargé automatiquement dans $(Pipeline.Workspace)/manifests
                - script: |
                    set -e
                    $(kubectl) version
                    $(kubectl) get nodes
                  displayName: 'Vérification de l''accès au cluster'

                # Le namespace doit exister avant les ressources qu'il contient.
                - script: $(kubectl) apply -f $(Pipeline.Workspace)/manifests/namespace.yaml
                  displayName: 'Namespace'

                # Secret pour que MicroK8s puisse tirer les images depuis l'ACR,
                # attaché au service account par défaut du namespace.
                - script: |
                    set -e
                    $(kubectl) create secret docker-registry $(imagePullSecret) \
                      --namespace $(k8sNamespace) \
                      --docker-server=$(containerRegistry) \
                      --docker-username="$ACR_USERNAME" \
                      --docker-password="$ACR_PASSWORD" \
                      --dry-run=client -o yaml | $(kubectl) apply -f -
                    $(kubectl) patch serviceaccount default -n $(k8sNamespace) \
                      -p '{"imagePullSecrets":[{"name":"$(imagePullSecret)"}]}'
                  displayName: 'Secret de pull ACR'
                  env:
                    ACR_USERNAME: $(ACR_USERNAME)
                    ACR_PASSWORD: $(ACR_PASSWORD)

                # Remplace le tag des images par celui du build (équivalent de « containers: » de KubernetesManifest)
                - script: |
                    set -e
                    cd $(Pipeline.Workspace)/manifests
                    sed -i -E "s#(image:[[:space:]]*$(containerRegistry)/$(backendRepository))(:[^[:space:]]*)?#\1:$(imageTag)#" backend.yaml
                    sed -i -E "s#(image:[[:space:]]*$(containerRegistry)/$(frontendRepository))(:[^[:space:]]*)?#\1:$(imageTag)#" frontend.yaml
                    grep -H "image:" backend.yaml frontend.yaml
                  displayName: 'Injection du tag d''image $(imageTag)'

                - script: |
                    set -e
                    cd $(Pipeline.Workspace)/manifests
                    $(kubectl) apply -n $(k8sNamespace) -f mongodb.yaml
                    $(kubectl) apply -n $(k8sNamespace) -f backend.yaml
                    $(kubectl) apply -n $(k8sNamespace) -f frontend.yaml
                    $(kubectl) apply -n $(k8sNamespace) -f ingress.yaml
                  displayName: 'MongoDB, backend, frontend et Ingress'

                - script: |
                    set -e
                    for d in $($(kubectl) get deployments -n $(k8sNamespace) -o name); do
                      echo "Attente de $d ..."
                      $(kubectl) rollout status "$d" -n $(k8sNamespace) --timeout=180s
                    done
                    $(kubectl) get pods,svc,ingress -n $(k8sNamespace)
                  displayName: 'Vérification du déploiement'