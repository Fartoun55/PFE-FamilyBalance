# Pipeline Azure DevOps de FamilyBalance
#   1. CI     : installation, vérification du backend, build Angular de production
#   2. Images : construction des images backend / frontend et envoi vers le registre
#               local de MicroK8s (localhost:32000)
#               puis publication d'une copie sur Docker Hub (ibrahimfr/...)
#   3. Deploy : déploiement des manifestes k8s/ sur le cluster MicroK8s local
#
# Tous les jobs tournent sur l'agent self-hosted « ibrahim-virtual-machine » (pool Default) :
#   - le cluster MicroK8s est sur une IP privée (192.168.x.x) : Azure DevOps (cloud) refuse
#     une service connection Kubernetes vers ce type d'adresse ;
#   - l'organisation n'a pas de parallélisme Microsoft-hosted gratuit.
#
# Pourquoi le registre local de MicroK8s (et pas Azure Container Registry) ?
#   Les images sont construites ET exécutées sur la même VM : un registre local évite
#   un service cloud payant, les identifiants ACR et le secret de pull Kubernetes.
#   MicroK8s fait confiance à localhost:32000 par défaut (pas de TLS à configurer).
#
# Prérequis sur la VM (une seule fois) :
#   - agent démarré en tant qu'ibrahim, membre des groupes microk8s et docker
#   - microk8s enable dns ingress registry
#   - Dockerfiles basés sur mirror.gcr.io/library/... (Docker Hub injoignable depuis la VM)
#
# À configurer dans Azure DevOps :
#   - Environnement « familybalance-production » (Pipelines > Environments)
#   - Service connection « dockerhub » (type Docker Registry > Docker Hub) :
#       Docker ID = ibrahimfr, mot de passe = token Docker Hub « Read & Write »
#
# Docker Hub n'est qu'une copie de publication : le cluster utilise le registre local.
# Si Docker Hub est injoignable depuis la VM, l'étape échoue en avertissement
# (continueOnError) sans bloquer le déploiement.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  # Registre d'images intégré à MicroK8s (addon « registry »)
  containerRegistry: 'localhost:32000'
  backendRepository: 'familybalance-backend'
  frontendRepository: 'familybalance-frontend'
  # Compte Docker Hub où les images sont publiées (ibrahimfr/familybalance-...)
  dockerHubNamespace: 'ibrahimfr'
  # Service connection Azure DevOps qui contient les identifiants Docker Hub
  dockerHubServiceConnection: 'dockerhub'
  k8sNamespace: 'familybalance'
  imageTag: '$(Build.BuildId)'
  nodeVersion: '20.x'
  # Pool d'agents où est inscrit l'agent self-hosted
  selfHostedPool: 'Default'
  # Chemin complet : le service de l'agent n'a pas forcément /snap/bin dans son PATH
  kubectl: '/snap/bin/microk8s kubectl'

stages:
  # ------------------------------------------------------------------ CI
  - stage: CI
    displayName: 'Vérification et build'
    jobs:
      - job: Backend
        displayName: 'Backend (Node.js)'
        pool:
          name: $(selfHostedPool)
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Node.js $(nodeVersion)'

          - script: npm ci
            workingDirectory: backend
            displayName: 'npm ci'

          - script: |
              set -e
              find src -name '*.js' -print0 | xargs -0 -n1 node --check
              node -e "require('./src/app')"
            workingDirectory: backend
            displayName: 'Vérification syntaxique et chargement de l''application'
            env:
              NODE_ENV: test

          - script: npm test -- --ci
            workingDirectory: backend
            displayName: 'Tests de l''API (Jest)'

          - script: npm audit --omit=dev --audit-level=critical
            workingDirectory: backend
            displayName: 'Audit des dépendances (vulnérabilités critiques)'
            continueOnError: true

      - job: Frontend
        displayName: 'Frontend (Angular)'
        # Ordre imposé : le frontend démarre seulement après la réussite du backend.
        # Sans dependsOn, les deux jobs sont indépendants et l'ordre est aléatoire.
        dependsOn: Backend
        pool:
          name: $(selfHostedPool)
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Node.js $(nodeVersion)'

          - script: npm ci
            workingDirectory: frontend
            displayName: 'npm ci'

          - script: npm run build -- --configuration production
            workingDirectory: frontend
            displayName: 'Build Angular de production'

  # ------------------------------------------------------------------ Images
  - stage: Images
    displayName: 'Images Docker'
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildPush
        displayName: 'Construction et envoi vers le registre MicroK8s'
        pool:
          name: $(selfHostedPool)
        steps:
          # Vérifie que le registre local répond avant de construire quoi que ce soit.
          - script: |
              if ! curl -sf http://$(containerRegistry)/v2/ > /dev/null; then
                echo "##[error]Registre $(containerRegistry) injoignable. Sur la VM : microk8s enable registry"
                exit 1
              fi
              echo "Registre $(containerRegistry) disponible"
            displayName: 'Vérification du registre MicroK8s'

          # Image backend : deux tags (numéro du build + latest), puis envoi au registre.
          - script: |
              set -e
              docker build \
                -t $(containerRegistry)/$(backendRepository):$(imageTag) \
                -t $(containerRegistry)/$(backendRepository):latest \
                -f backend/Dockerfile backend
              docker push $(containerRegistry)/$(backendRepository):$(imageTag)
              docker push $(containerRegistry)/$(backendRepository):latest
            displayName: 'Image backend'

          # Image frontend : même principe.
          - script: |
              set -e
              docker build \
                -t $(containerRegistry)/$(frontendRepository):$(imageTag) \
                -t $(containerRegistry)/$(frontendRepository):latest \
                -f frontend/Dockerfile frontend
              docker push $(containerRegistry)/$(frontendRepository):$(imageTag)
              docker push $(containerRegistry)/$(frontendRepository):latest
            displayName: 'Image frontend'

          # Publication des mêmes images sur Docker Hub (numéro du build + latest).
          #  - Les identifiants viennent de la service connection « dockerhub » :
          #    aucun token dans ce fichier (dépôt public) ni dans les logs.
          #  - La tâche Docker@2 « login » prépare une configuration Docker temporaire
          #    (DOCKER_CONFIG) utilisée par les étapes suivantes du job.
          #  - continueOnError : un problème Docker Hub ne bloque pas le déploiement.
          - task: Docker@2
            displayName: 'Connexion à Docker Hub'
            continueOnError: true
            inputs:
              command: login
              containerRegistry: $(dockerHubServiceConnection)

          - script: |
              set -e
              for repo in $(backendRepository) $(frontendRepository); do
                for tag in $(imageTag) latest; do
                  docker tag $(containerRegistry)/$repo:$tag $(dockerHubNamespace)/$repo:$tag
                  docker push $(dockerHubNamespace)/$repo:$tag
                done
              done
            displayName: 'Publication sur Docker Hub'
            continueOnError: true

          # Déconnexion systématique, même si la publication a échoué.
          - task: Docker@2
            displayName: 'Déconnexion de Docker Hub'
            condition: always()
            continueOnError: true
            inputs:
              command: logout
              containerRegistry: $(dockerHubServiceConnection)

          - publish: k8s
            artifact: manifests
            displayName: 'Publication des manifestes Kubernetes'

  # ------------------------------------------------------------------ Deploy
  - stage: Deploy
    displayName: 'Déploiement MicroK8s'
    dependsOn: Images
    condition: succeeded()
    jobs:
      - deployment: DeployMicroK8s
        displayName: 'Déploiement sur MicroK8s (agent self-hosted)'
        pool:
          name: $(selfHostedPool)
        environment: 'familybalance-production'
        strategy:
          runOnce:
            deploy:
              steps:
                # L'artefact « manifests » est téléchargé automatiquement dans $(Pipeline.Workspace)/manifests
                - script: |
                    set -e
                    $(kubectl) version
                    $(kubectl) get nodes
                  displayName: 'Vérification de l''accès au cluster'

                # Le namespace doit exister avant les ressources qu'il contient.
                - script: $(kubectl) apply -f $(Pipeline.Workspace)/manifests/namespace.yaml
                  displayName: 'Namespace'

                # Réécrit la ligne « image: » des manifestes, quel que soit le registre
                # d'origine (ex. familybalanceacr.azurecr.io/...), vers :
                #   localhost:32000/familybalance-backend:<numéro du build>
                - script: |
                    set -e
                    cd $(Pipeline.Workspace)/manifests
                    sed -i -E "s#(image:[[:space:]]*)[^[:space:]]*$(backendRepository)(:[^[:space:]]*)?#\1$(containerRegistry)/$(backendRepository):$(imageTag)#" backend.yaml
                    sed -i -E "s#(image:[[:space:]]*)[^[:space:]]*$(frontendRepository)(:[^[:space:]]*)?#\1$(containerRegistry)/$(frontendRepository):$(imageTag)#" frontend.yaml
                    grep -H "image:" backend.yaml frontend.yaml
                  displayName: 'Injection du tag d''image $(imageTag)'

                - script: |
                    set -e
                    cd $(Pipeline.Workspace)/manifests
                    $(kubectl) apply -n $(k8sNamespace) -f mongodb.yaml
                    $(kubectl) apply -n $(k8sNamespace) -f backend.yaml
                    $(kubectl) apply -n $(k8sNamespace) -f frontend.yaml
                    $(kubectl) apply -n $(k8sNamespace) -f ingress.yaml
                  displayName: 'MongoDB, backend, frontend et Ingress'

                - script: |
                    set -e
                    for d in $($(kubectl) get deployments -n $(k8sNamespace) -o name); do
                      echo "Attente de $d ..."
                      $(kubectl) rollout status "$d" -n $(k8sNamespace) --timeout=180s
                    done
                    $(kubectl) get pods,svc,ingress -n $(k8sNamespace)
                  displayName: 'Vérification du déploiement'