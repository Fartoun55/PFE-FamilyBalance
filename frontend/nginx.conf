server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sonde de santé Kubernetes (readinessProbe / livenessProbe)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # API REST -> backend
    location /api/ {
        proxy_pass http://familybalance-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Temps réel (Socket.IO / WebSocket) -> backend
    location /socket.io/ {
        proxy_pass http://familybalance-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Fichiers téléversés servis par le backend
    location /uploads/ {
        proxy_pass http://familybalance-backend:3000;
        proxy_set_header Host $host;
    }

    # Angular (routing côté client)
    location / {
        try_files $uri $uri/ /index.html;
    }
}