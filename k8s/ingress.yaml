# Point d'entrée public en HTTP : http://familybalance-app.com
#
# Prérequis sur MicroK8s : microk8s enable ingress (classe d'Ingress « public »)
# et le nom familybalance-app.com résolu vers l'IP de la machine (DNS ou fichier hosts).
#
# Le site est servi en HTTP simple, sans certificat. Le backend reçoit donc
# COOKIE_SECURE=false (voir backend.yaml) : sinon le navigateur refuserait le cookie
# de session et l'utilisateur serait déconnecté au bout de 15 minutes.
# Pour repasser en HTTPS : ajouter un bloc tls + cert-manager, ssl-redirect à "true",
# CLIENT_ORIGIN en https:// et COOKIE_SECURE à "true".

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: familybalance
  namespace: familybalance
  annotations:
    # HTTP simple : pas de redirection forcée vers HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Téléversement des ressources éducatives (15 Mo max côté API)
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    # Connexions WebSocket (Socket.IO) longues
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: public
  rules:
    - host: familybalance-app.com
      http:
        paths:
          # Tout passe par le frontend : son nginx sert Angular et relaie /api,
          # /socket.io et /uploads au backend (même origine, pas de CORS).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: familybalance-frontend
                port:
                  number: 80
