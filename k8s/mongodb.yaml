# Base de données MongoDB (une instance, données sur disque persistant).
#
# Prérequis (une seule fois, hors dépôt : ne jamais versionner de mot de passe) :
#   kubectl -n familybalance create secret generic mongodb-secret \
#     --from-literal=MONGO_INITDB_ROOT_USERNAME=familybalance \
#     --from-literal=MONGO_INITDB_ROOT_PASSWORD="$(openssl rand -hex 24)"
#
# Le backend s'y connecte via le Service « mongodb » (voir MONGODB_URI dans backend.yaml).
# Alternative managée : Azure Cosmos DB for MongoDB — il suffit alors de ne pas appliquer
# ce fichier et de renseigner son URI dans le secret du backend.

apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: familybalance
  labels:
    app: mongodb
spec:
  clusterIP: None          # Service « headless » : adresse stable du pod mongodb-0
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: familybalance
  labels:
    app: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999       # utilisateur « mongodb » de l'image officielle
        fsGroup: 999
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
              name: mongodb
          envFrom:
            - secretRef:
                name: mongodb-secret
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: microk8s-hostpath
        resources:
          requests:
            storage: 10Gi
